plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// GeckoLib (modelos e animações no formato Bedrock feitos no Blockbench)
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content { includeGroupByRegex("software\\.bernie.*") }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"galetocraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Teste automático no cliente: abre o jogo, cria um mundo de teste, invoca o Pirococó e tira prints.
// Rodar com: gradlew runClientGameTest
// Só testes de cliente em mundo de um jogador; testes de servidor dedicado ficam desligados.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "galetocraft-teste"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Núcleo de regras (Java puro, em nucleo/), embutido no jar do mod
	implementation project(":nucleo")
	include project(":nucleo")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
